# Node A: B -> A throughput sink, relay.

CONFIG_LAB_A_TPUT_SERVER=y
# No other lab traffic during the measurement.
CONFIG_LAB_A_UDP_ECHO_NODE_B=n
CONFIG_LAB_A_TCP_STREAM=n
CONFIG_LAB_A_PING_NODE_B=n
CONFIG_LAB_A_PING_RELAY=n
# Through the relay (the default pin).
CONFIG_LAB_A_PIN_RELAY=y
# Larger lwIP TCP window/buffers: the default 14.6 KB window caps TCP near 3.9 Mbit/s at the ~30 ms
# two-hop RTT.
CONFIG_LWIP_TCP_WND_DEFAULT=32768
CONFIG_LWIP_TCP_SND_BUF_DEFAULT=32768
CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
CONFIG_LWIP_UDP_RECVMBOX_SIZE=32
