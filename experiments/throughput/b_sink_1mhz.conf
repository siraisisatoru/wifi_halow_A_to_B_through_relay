# Node B: A -> B throughput sink, 1 MHz (AU S1G channel 36, 920.0 MHz, op class 50).

CONFIG_LAB_B_TPUT_SERVER=y
CONFIG_LAB_S1G_CHAN_NUM=36
CONFIG_LAB_OP_CLASS=50
CONFIG_LAB_PRI_BW_MHZ=1
CONFIG_LAB_PRI_1MHZ_CHAN_IDX=0
# Larger lwIP TCP window/buffers: the default 14.6 KB window caps TCP near 3.9 Mbit/s at the ~30 ms
# two-hop RTT.
CONFIG_LWIP_TCP_WND_DEFAULT=32768
CONFIG_LWIP_TCP_SND_BUF_DEFAULT=32768
CONFIG_LWIP_TCP_RECVMBOX_SIZE=32
CONFIG_LWIP_UDP_RECVMBOX_SIZE=32
